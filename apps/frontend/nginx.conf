server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Swagger UI is served by the API at this exact path, so it must NOT have the
  # /api prefix stripped — matched before the general /api/ rule below.
  location /api/docs {
    proxy_pass http://api:3000/api/docs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Application XHR. The trailing slash on proxy_pass strips the /api prefix,
  # so /api/events reaches the API as /events.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed asset filenames are immutable, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: /events/:id is a client-side route with no file on disk, so
  # a deep link or a refresh must still return index.html rather than 404.
  location / {
    try_files $uri $uri/ /index.html;
    # index.html itself must never be cached, or a browser keeps loading the
    # old one and requesting asset hashes that no longer exist after a deploy.
    add_header Cache-Control "no-cache";
  }
}
